# ===================================================================
# Hospital Management System Configuration
# ===================================================================
spring.application.name=Hospital Management System
server.port=8080

# -------------------------------------------------------------------
# Embedded H2 File-Based Database Persistence
# Persists data to './data/hospitaldb' across application restarts
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/hospitaldb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# Optional: MySQL Database Configuration (Uncomment below to use MySQL)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# -------------------------------------------------------------------
# Thymeleaf Template Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Hospital Profile Constants
hospital.name=LifeCare Multispeciality Hospital
hospital.tagline=Compassionate Care, Clinical Excellence
hospital.address=100 Healthcare Avenue, Medical District, Kochi, Kerala - 682001
hospital.phone=+91 (0484) 285-4000 / 4001
hospital.email=contact@lifecarehospital.org
hospital.consultation.default-fee=500.00
