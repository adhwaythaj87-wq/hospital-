<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Book Appointment')}"></head>
<body>

    <header th:replace="~{layout/main :: header}"></header>

    <main class="main-wrapper">
        <div th:replace="~{layout/main :: alerts}"></div>

        <div class="page-header">
            <div class="page-title">
                <h2>Book Doctor Consultation</h2>
                <p>Link a registered patient with an available specialist doctor</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/appointments}" class="btn btn-secondary">
                    &larr; Back to Appointments
                </a>
            </div>
        </div>

        <div class="card" style="max-width: 850px; margin: 0 auto;">
            <div class="card-header">
                <h3>Appointment Booking Form</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/appointments/save}" th:object="${appointment}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="form-grid">

                        <!-- Appointment Code -->
                        <div class="form-group">
                            <label class="form-label" for="appointmentCode">Appointment Code</label>
                            <input type="text" id="appointmentCode" th:field="*{appointmentCode}" class="form-control" readonly />
                            <span class="form-hint">Auto-generated tracking code</span>
                        </div>

                        <!-- Status -->
                        <div class="form-group">
                            <label class="form-label" for="status">Initial Status <span class="required">*</span></label>
                            <select id="status" th:field="*{status}" class="form-select" required>
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.displayName}"></option>
                            </select>
                        </div>

                        <!-- Select Patient -->
                        <div class="form-group">
                            <label class="form-label" for="patientSelect">Select Patient <span class="required">*</span></label>
                            <select id="patientSelect" th:field="*{patient.id}" class="form-select"
                                    th:classappend="${#fields.hasErrors('patient') ? 'is-invalid' : ''}" required>
                                <option value="">-- Choose a Registered Patient --</option>
                                <option th:each="p : ${patients}"
                                        th:value="${p.id}"
                                        th:text="${p.patientCode} + ' - ' + ${p.fullName} + ' (' + ${p.phone} + ')'"
                                        th:selected="${appointment.patient != null and appointment.patient.id == p.id}">
                                </option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('patient')}" th:errors="*{patient}"></span>
                            <span class="form-hint">Need to register a new patient? <a th:href="@{/patients/new}" target="_blank">Click here</a>.</span>
                        </div>

                        <!-- Select Doctor -->
                        <div class="form-group">
                            <label class="form-label" for="doctorSelect">Select Doctor / Specialist <span class="required">*</span></label>
                            <select id="doctorSelect" th:field="*{doctor.id}" class="form-select"
                                    th:classappend="${#fields.hasErrors('doctor') ? 'is-invalid' : ''}" required>
                                <option value="">-- Choose a Doctor --</option>
                                <option th:each="d : ${doctors}"
                                        th:value="${d.id}"
                                        th:text="${d.doctorCode} + ' - ' + ${d.fullName} + ' [' + ${d.specialization} + '] (₹' + ${d.consultationFee} + ')'"
                                        th:selected="${appointment.doctor != null and appointment.doctor.id == d.id}">
                                </option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('doctor')}" th:errors="*{doctor}"></span>
                        </div>

                        <!-- Appointment Date -->
                        <div class="form-group">
                            <label class="form-label" for="appointmentDate">Appointment Date <span class="required">*</span></label>
                            <input type="date" id="appointmentDate" th:field="*{appointmentDate}" class="form-control"
                                   th:classappend="${#fields.hasErrors('appointmentDate') ? 'is-invalid' : ''}" required />
                            <span class="field-error" th:if="${#fields.hasErrors('appointmentDate')}" th:errors="*{appointmentDate}"></span>
                        </div>

                        <!-- Appointment Time -->
                        <div class="form-group">
                            <label class="form-label" for="appointmentTime">Appointment Time <span class="required">*</span></label>
                            <input type="time" id="appointmentTime" th:field="*{appointmentTime}" class="form-control"
                                   th:classappend="${#fields.hasErrors('appointmentTime') ? 'is-invalid' : ''}" required />
                            <span class="field-error" th:if="${#fields.hasErrors('appointmentTime')}" th:errors="*{appointmentTime}"></span>
                        </div>

                        <!-- Chief Complaint / Reason -->
                        <div class="form-group full-width">
                            <label class="form-label" for="chiefComplaint">Chief Complaint / Purpose of Visit <span class="required">*</span></label>
                            <input type="text" id="chiefComplaint" th:field="*{chiefComplaint}" class="form-control"
                                   th:classappend="${#fields.hasErrors('chiefComplaint') ? 'is-invalid' : ''}"
                                   placeholder="e.g. Chest discomfort, seasonal fever, knee pain checkup..." required />
                            <span class="field-error" th:if="${#fields.hasErrors('chiefComplaint')}" th:errors="*{chiefComplaint}"></span>
                        </div>

                        <!-- Additional Notes -->
                        <div class="form-group full-width">
                            <label class="form-label" for="notes">Clinical / Reception Notes</label>
                            <textarea id="notes" th:field="*{notes}" class="form-control" rows="2"
                                      placeholder="e.g. Patient requested morning slot; bring previous blood test reports..."></textarea>
                        </div>

                    </div>

                    <div class="form-actions">
                        <a th:href="@{/appointments}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <span>📅 Confirm & Book Appointment</span>
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/main :: footer}"></footer>

</body>
</html>
