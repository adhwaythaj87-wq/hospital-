<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head(${isEdit ? 'Edit Patient' : 'Register New Patient'})}"></head>
<body>

    <header th:replace="~{layout/main :: header}"></header>

    <main class="main-wrapper">
        <div th:replace="~{layout/main :: alerts}"></div>

        <div class="page-header">
            <div class="page-title">
                <h2 th:text="${isEdit ? 'Edit Patient Profile' : 'Register New Patient'}">Register Patient</h2>
                <p>Enter patient demographic and contact information</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/patients}" class="btn btn-secondary">
                    &larr; Back to Patients List
                </a>
            </div>
        </div>

        <div class="card" style="max-width: 850px; margin: 0 auto;">
            <div class="card-header">
                <h3 th:text="${isEdit ? 'Patient Details: ' + patient.fullName : 'New Patient Registration Form'}">Form</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/patients/save}" th:object="${patient}" method="post">
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" name="isEdit" th:value="${isEdit}" />

                    <div class="form-grid">

                        <!-- Patient ID -->
                        <div class="form-group">
                            <label class="form-label" for="patientCode">Patient ID / Code <span class="required">*</span></label>
                            <input type="text" id="patientCode" th:field="*{patientCode}" class="form-control"
                                   th:classappend="${#fields.hasErrors('patientCode') ? 'is-invalid' : ''}"
                                   placeholder="e.g. P-1001" required />
                            <span class="field-error" th:if="${#fields.hasErrors('patientCode')}" th:errors="*{patientCode}"></span>
                            <span class="form-hint">Unique identifier used for lookup across all modules.</span>
                        </div>

                        <!-- Full Name -->
                        <div class="form-group">
                            <label class="form-label" for="fullName">Full Name <span class="required">*</span></label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName') ? 'is-invalid' : ''}"
                                   placeholder="e.g. Rahul Varma" required />
                            <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                        </div>

                        <!-- Age -->
                        <div class="form-group">
                            <label class="form-label" for="age">Age (Years) <span class="required">*</span></label>
                            <input type="number" id="age" th:field="*{age}" class="form-control"
                                   th:classappend="${#fields.hasErrors('age') ? 'is-invalid' : ''}"
                                   placeholder="e.g. 34" min="0" max="150" required />
                            <span class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
                        </div>

                        <!-- Gender -->
                        <div class="form-group">
                            <label class="form-label" for="gender">Gender <span class="required">*</span></label>
                            <select id="gender" th:field="*{gender}" class="form-select" required>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
                        </div>

                        <!-- Phone Number -->
                        <div class="form-group">
                            <label class="form-label" for="phone">Phone Number <span class="required">*</span></label>
                            <input type="tel" id="phone" th:field="*{phone}" class="form-control"
                                   th:classappend="${#fields.hasErrors('phone') ? 'is-invalid' : ''}"
                                   placeholder="e.g. 9876543210" required />
                            <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label class="form-label" for="email">Email Address</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}"
                                   placeholder="e.g. patient@example.com" />
                            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                        </div>

                        <!-- Blood Group -->
                        <div class="form-group">
                            <label class="form-label" for="bloodGroup">Blood Group</label>
                            <select id="bloodGroup" th:field="*{bloodGroup}" class="form-select">
                                <option value="">-- Select Blood Group --</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                            </select>
                        </div>

                        <!-- Emergency Contact -->
                        <div class="form-group">
                            <label class="form-label" for="emergencyContact">Emergency Contact</label>
                            <input type="text" id="emergencyContact" th:field="*{emergencyContact}" class="form-control"
                                   placeholder="e.g. Priya Varma (Wife) - 9876543299" />
                        </div>

                        <!-- Residential Address -->
                        <div class="form-group full-width">
                            <label class="form-label" for="address">Residential Address</label>
                            <input type="text" id="address" th:field="*{address}" class="form-control"
                                   placeholder="e.g. 42 MG Road, Kochi, Kerala" />
                        </div>

                        <!-- Pre-existing Medical Conditions / History -->
                        <div class="form-group full-width">
                            <label class="form-label" for="medicalHistory">Medical Notes / Known Allergies</label>
                            <textarea id="medicalHistory" th:field="*{medicalHistory}" class="form-control" rows="3"
                                      placeholder="e.g. Mild hypertension, allergic to Penicillin, diabetic history..."></textarea>
                        </div>

                    </div>

                    <div class="form-actions">
                        <a th:href="@{/patients}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <span th:text="${isEdit ? '💾 Update Patient' : '➕ Register Patient'}">Submit</span>
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/main :: footer}"></footer>

</body>
</html>
