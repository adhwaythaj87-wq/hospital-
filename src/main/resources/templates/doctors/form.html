<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head(${isEdit ? 'Edit Doctor Profile' : 'Add New Doctor'})}"></head>
<body>

    <header th:replace="~{layout/main :: header}"></header>

    <main class="main-wrapper">
        <div th:replace="~{layout/main :: alerts}"></div>

        <div class="page-header">
            <div class="page-title">
                <h2 th:text="${isEdit ? 'Edit Doctor Profile' : 'Add New Doctor'}">Add Doctor</h2>
                <p>Register medical consultant details, department specialization, and fees</p>
            </div>
            <div class="page-actions">
                <a th:href="@{/doctors}" class="btn btn-secondary">
                    &larr; Back to Doctors
                </a>
            </div>
        </div>

        <div class="card" style="max-width: 850px; margin: 0 auto;">
            <div class="card-header">
                <h3 th:text="${isEdit ? 'Doctor Profile: ' + doctor.fullName : 'Doctor Registration Form'}">Form</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/doctors/save}" th:object="${doctor}" method="post">
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" name="isEdit" th:value="${isEdit}" />

                    <div class="form-grid">

                        <!-- Doctor ID -->
                        <div class="form-group">
                            <label class="form-label" for="doctorCode">Doctor ID / Code <span class="required">*</span></label>
                            <input type="text" id="doctorCode" th:field="*{doctorCode}" class="form-control"
                                   th:classappend="${#fields.hasErrors('doctorCode') ? 'is-invalid' : ''}"
                                   placeholder="e.g. D-101" required />
                            <span class="field-error" th:if="${#fields.hasErrors('doctorCode')}" th:errors="*{doctorCode}"></span>
                        </div>

                        <!-- Full Name -->
                        <div class="form-group">
                            <label class="form-label" for="fullName">Doctor Full Name <span class="required">*</span></label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName') ? 'is-invalid' : ''}"
                                   placeholder="e.g. Dr. Rajesh Sharma" required />
                            <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                        </div>

                        <!-- Specialization -->
                        <div class="form-group">
                            <label class="form-label" for="specialization">Medical Specialization <span class="required">*</span></label>
                            <select id="specialization" th:field="*{specialization}" class="form-select" required>
                                <option value="General Medicine">General Medicine</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="Orthopedics">Orthopedics</option>
                                <option value="Dermatology">Dermatology</option>
                                <option value="Neurology">Neurology</option>
                                <option value="Gynecology & Obstetrics">Gynecology & Obstetrics</option>
                                <option value="Ophthalmology (Eye Care)">Ophthalmology (Eye Care)</option>
                                <option value="ENT (Ear, Nose, Throat)">ENT (Ear, Nose, Throat)</option>
                                <option value="Gastroenterology">Gastroenterology</option>
                                <option value="Pulmonology">Pulmonology</option>
                                <option value="Dentistry">Dentistry</option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('specialization')}" th:errors="*{specialization}"></span>
                        </div>

                        <!-- Qualification -->
                        <div class="form-group">
                            <label class="form-label" for="qualification">Qualifications / Degrees</label>
                            <input type="text" id="qualification" th:field="*{qualification}" class="form-control"
                                   placeholder="e.g. MBBS, MD (Cardiology), DM" />
                        </div>

                        <!-- Phone -->
                        <div class="form-group">
                            <label class="form-label" for="phone">Contact Phone <span class="required">*</span></label>
                            <input type="tel" id="phone" th:field="*{phone}" class="form-control"
                                   th:classappend="${#fields.hasErrors('phone') ? 'is-invalid' : ''}"
                                   placeholder="e.g. +91 98450 11223" required />
                            <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label class="form-label" for="email">Email Address</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}"
                                   placeholder="e.g. doctor@lifecare.org" />
                            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                        </div>

                        <!-- Consultation Fee -->
                        <div class="form-group">
                            <label class="form-label" for="consultationFee">Consultation Fee (₹) <span class="required">*</span></label>
                            <input type="number" step="0.01" id="consultationFee" th:field="*{consultationFee}" class="form-control"
                                   th:classappend="${#fields.hasErrors('consultationFee') ? 'is-invalid' : ''}"
                                   placeholder="500.00" min="0" required />
                            <span class="field-error" th:if="${#fields.hasErrors('consultationFee')}" th:errors="*{consultationFee}"></span>
                        </div>

                        <!-- Room / Department -->
                        <div class="form-group">
                            <label class="form-label" for="roomNumber">OPD Room / Cabin</label>
                            <input type="text" id="roomNumber" th:field="*{roomNumber}" class="form-control"
                                   placeholder="e.g. Room 102 (OPD Block A)" />
                        </div>

                        <!-- Available Schedule -->
                        <div class="form-group full-width">
                            <label class="form-label" for="availableDays">Available Days & OPD Timings</label>
                            <input type="text" id="availableDays" th:field="*{availableDays}" class="form-control"
                                   placeholder="e.g. Mon - Fri (09:00 AM - 02:00 PM)" />
                        </div>

                    </div>

                    <div class="form-actions">
                        <a th:href="@{/doctors}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <span th:text="${isEdit ? '💾 Update Doctor' : '➕ Save Doctor'}">Save Doctor</span>
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </main>

    <footer th:replace="~{layout/main :: footer}"></footer>

</body>
</html>
