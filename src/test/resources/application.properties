# ===================================================================
# LifeCare HMS - Test Configuration (In-Memory H2 Database)
# ===================================================================
spring.application.name=Hospital Management System Tests

# In-Memory H2 DB for fast, isolated, non-polluting tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=LEGACY
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Thymeleaf Template Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Hospital Profile Constants
hospital.name=LifeCare Multispeciality Hospital
hospital.tagline=Compassionate Care, Clinical Excellence
hospital.address=100 Healthcare Avenue, Medical District, Kochi, Kerala - 682001
hospital.phone=+91 (0484) 285-4000 / 4001
hospital.email=contact@lifecarehospital.org
hospital.consultation.default-fee=500.00
